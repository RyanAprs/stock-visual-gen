[project]
name = "stockgen"
version = "0.1.0"
description = "Generate original motion-graphics clips + Adobe Stock CSV metadata"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "cairosvg>=2.7",
    "vtracer>=0.6",
]

[project.scripts]
stockgen = "stockgen.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockgen"]
