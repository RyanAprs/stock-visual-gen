# ---- stockgen config ----

# Output resolution (Adobe Stock wants >= 4MP for video; 4K = 8.3MP)
resolution: "3840x2160"          # 4K UHD
fps: 30
duration_sec: 10                 # per clip (stock loops: 8-15s ideal)

render:
  sketches_dir: "sketches"
  # chrome/chromium path override (blank = puppeteer's bundled chrome)
  chrome_path: ""

# ---- Metadata (Adobe Stock CSV) ----
metadata:
  provider: "ollama"             # ollama | groq | rule
  ollama_model: "llama3.2:3b"
  ollama_host: "http://localhost:11434"
  vision_model: "moondream"      # AI Vision: small+free local model for auto-describe
  auto_describe: true            # Smart AI Vision: look at each asset to write title/keywords
  keywords_count: 42             # 30-50 high-ranking SEO keywords per asset (Adobe max 49)
  # Adobe Stock category IDs: https://helpx.adobe.com/stock/contributor/help/... 
  # 8 = Backgrounds/Textures, 11 = Graphic Resources
  default_category: 8
  seo_boost: true                # append high-search-volume stock terms per kind

# ---- Clip loop ----
loop: true                       # render seamless loops (stock buyers prefer loops)

# ---- Music (for compiled watch-videos; individual stock clips stay silent) ----
music:
  enabled: true
  provider: "jamendo"            # jamendo (auto-fetch) | local (files only)
  mood: "chillout"               # single-word Jamendo tag: chillout/ambient/relaxing/lounge
  dir: "assets/music"            # local files here take priority over Jamendo
  volume: 0.5                    # 0..1 background level for compiled videos
