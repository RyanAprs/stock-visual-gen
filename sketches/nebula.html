<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>nebula</title>
<script>p5.disableFriendlyErrors = true;</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
<style>html,body{margin:0;padding:0;overflow:hidden;background:#000}canvas{display:block}</style>
</head>
<body>
<script>
// === stockgen sketch: cinematic bokeh / nebula light loop ===
// Soft glowing orbs drifting + additive blend. Dreamy, cosmic.
const P = Object.assign({ seed:42, width:3840, height:2160, frames:300 }, window.STOCKGEN || {});

let PAL, orbs=[];
const PALETTES = [
  {bg:'#03060f', hues:[205,220,190]}, {bg:'#0a0413', hues:[290,315,265]},
  {bg:'#0a0703', hues:[40,25,50]},    {bg:'#03100b', hues:[155,175,140]},
  {bg:'#0f0403', hues:[8,350,25]},
];
const N = 90;

function setup(){
  createCanvas(P.width,P.height);
  pixelDensity(1);
  colorMode(HSB,360,100,100,100);
  randomSeed(P.seed); noiseSeed(P.seed);
  PAL = PALETTES[P.seed % PALETTES.length];
  for (let i=0;i<N;i++){
    orbs.push({
      x:random(width), y:random(height),
      r:random(60,520),
      h:PAL.hues[floor(random(PAL.hues.length))]+random(-10,10),
      drift:random(20,90), phase:random(TWO_PI), spd:random(0.6,1.8),
    });
  }
  noLoop();
  window._p5Ready = true;
}

function draw(){
  const t = frameCount / P.frames;
  const ang = TWO_PI * t;
  background(PAL.bg);
  blendMode(ADD);
  noStroke();
  for (const o of orbs){
    // looped drift
    const ox = o.x + Math.cos(ang*o.spd + o.phase)*o.drift;
    const oy = o.y + Math.sin(ang*o.spd + o.phase*1.3)*o.drift;
    const pulse = 0.7 + 0.3*Math.sin(ang*2 + o.phase);
    // soft radial glow via stacked translucent circles
    for (let k=6; k>=1; k--){
      const rr = o.r * (k/6) * pulse;
      fill(o.h%360, 70, 90, 3.2);
      ellipse(ox, oy, rr*2, rr*2);
    }
  }
  blendMode(BLEND);
}
</script>
</body>
</html>
