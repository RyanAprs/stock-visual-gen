<!DOCTYPE html>
<html>
<head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
<style>html,body{margin:0;overflow:hidden;background:#000}</style>
</head>
<body>
<script>
// Globe / Map Projection — generative dotted wireframe earth
// No external textures needed (100% procedural = original IP, safe for stock)
// Style: glowing dot-matrix globe with latitude/longitude grid + random "data points"

p5.disableFriendlyErrors = true;

const PARAMS = window.STOCKGEN || {};
const W = PARAMS.width || 1080;
const H = PARAMS.height || 1920;
const SEED = PARAMS.seed || 42;
const TOTAL_FRAMES = PARAMS.frames || 300;

let frame = 0;
let dataPoints = [];

function setup() {
  createCanvas(W, H, WEBGL);
  randomSeed(SEED);
  noiseSeed(SEED);

  // generate random "data points" on the sphere (cities/events)
  for (let i = 0; i < 60; i++) {
    dataPoints.push({
      lat: random(-PI / 2, PI / 2),
      lon: random(-PI, PI),
      size: random(2, 8),
      pulse: random(0.02, 0.06),
      hue: random(160, 220),       // cyan-blue range
    });
  }

  if (PARAMS.frames) noLoop();
}

function draw() {
  background(8, 10, 18);

  // subtle ambient light + directional
  ambientLight(30, 30, 50);
  directionalLight(200, 220, 255, 0.5, 0.5, -1);

  let r = min(W, H) * 0.38;
  let rotSpeed = TWO_PI / 600;  // full rotation in 600 frames = 20s @ 30fps
  let angle = frame * rotSpeed;

  push();
  // slight tilt for visual interest
  rotateX(0.3);
  rotateY(angle);

  // --- Draw latitude/longitude grid as dots ---
  colorMode(HSB, 360, 100, 100, 100);
  let latSteps = 18;
  let lonSteps = 36;
  let dotSpacing = 6; // degrees per dot along each line

  // longitude lines (meridians)
  for (let i = 0; i < lonSteps; i++) {
    let lon = map(i, 0, lonSteps, -PI, PI);
    for (let j = 0; j <= 180; j += dotSpacing) {
      let lat = map(j, 0, 180, -PI / 2, PI / 2);
      let x = r * cos(lat) * cos(lon);
      let y = r * sin(lat);
      let z = r * cos(lat) * sin(lon);

      let bright = map(sin(lat * 3 + frame * 0.02), -1, 1, 40, 90);
      stroke(200, 40, bright, 70);
      strokeWeight(2.0);
      point(x, y, z);
    }
  }

  // latitude lines (parallels)
  for (let i = 0; i < latSteps; i++) {
    let lat = map(i, 0, latSteps, -PI / 2, PI / 2);
    for (let j = 0; j <= 360; j += dotSpacing) {
      let lon = map(j, 0, 360, -PI, PI);
      let x = r * cos(lat) * cos(lon);
      let y = r * sin(lat);
      let z = r * cos(lat) * sin(lon);

      let bright = map(cos(lon * 2 + frame * 0.015), -1, 1, 35, 80);
      stroke(210, 30, bright, 65);
      strokeWeight(1.8);
      point(x, y, z);
    }
  }

  // --- Glowing data points (pulsing) ---
  for (let dp of dataPoints) {
    let x = r * cos(dp.lat) * cos(dp.lon);
    let y = r * sin(dp.lat);
    let z = r * cos(dp.lat) * sin(dp.lon);

    let pulse = 0.5 + 0.5 * sin(frame * dp.pulse);
    let sz = dp.size * (1 + pulse * 0.8);

    // glow halo
    noStroke();
    fill(dp.hue, 80, 90, 25 * pulse);
    push();
    translate(x, y, z);
    sphere(sz * 2.5);
    pop();

    // bright core
    fill(dp.hue, 60, 100, 70 + 30 * pulse);
    push();
    translate(x, y, z);
    sphere(sz);
    pop();
  }

  // --- Connection arcs between random pairs ---
  let arcCount = 8;
  stroke(190, 70, 90, 50);
  strokeWeight(1.5);
  noFill();
  for (let a = 0; a < arcCount; a++) {
    let dp1 = dataPoints[a % dataPoints.length];
    let dp2 = dataPoints[(a * 7 + 3) % dataPoints.length];

    let steps = 30;
    beginShape();
    for (let s = 0; s <= steps; s++) {
      let t = s / steps;
      let lat = lerp(dp1.lat, dp2.lat, t);
      let lon = lerp(dp1.lon, dp2.lon, t);
      let lift = sin(t * PI) * r * 0.15; // arc above surface
      let rr = r + lift;
      let x = rr * cos(lat) * cos(lon);
      let y = rr * sin(lat);
      let z = rr * cos(lat) * sin(lon);
      vertex(x, y, z);
    }
    endShape();
  }

  pop();

  // --- Outer glow ring (atmosphere) ---
  push();
  rotateX(0.3);
  noFill();
  stroke(200, 50, 60, 12);
  strokeWeight(2);
  ellipse(0, 0, r * 2.15, r * 2.15);
  stroke(200, 40, 40, 8);
  strokeWeight(4);
  ellipse(0, 0, r * 2.25, r * 2.25);
  pop();

  frame++;
  if (PARAMS.frames && frame >= TOTAL_FRAMES) {
    if (typeof window._STOCKGEN_DONE === 'function') window._STOCKGEN_DONE();
  }
}

// headless renderer hook
if (PARAMS.frames) {
  draw();
}
</script>
</body>
</html>
