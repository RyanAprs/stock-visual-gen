<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>gradient</title>
<script>p5.disableFriendlyErrors = true;</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
<style>html,body{margin:0;padding:0;overflow:hidden;background:#000}canvas{display:block}</style>
</head>
<body>
<script>
// === stockgen sketch: flowing gradient / plasma field ===
// Seamless loop via looped noise time. Soft, calm, wallpaper-grade.
const P = Object.assign({ seed:42, width:3840, height:2160, frames:300 }, window.STOCKGEN || {});

let PAL;
const PALETTES = [
  [[210,80,30],[190,70,55],[230,60,20]],   // deep blue
  [[300,60,30],[330,55,50],[270,65,25]],   // violet
  [[35,75,35],[50,70,60],[20,80,30]],      // gold sunrise
  [[160,55,30],[140,60,55],[180,50,25]],   // teal
  [[10,70,35],[350,65,55],[30,75,30]],     // ember
];

function setup(){
  createCanvas(P.width,P.height);
  pixelDensity(1);
  colorMode(HSB,360,100,100,100);
  randomSeed(P.seed); noiseSeed(P.seed);
  PAL = PALETTES[P.seed % PALETTES.length];
  noLoop();
  window._p5Ready = true;
}

function draw(){
  const t = frameCount / P.frames;
  const ang = TWO_PI * t;
  const cols = PAL.map(c => color(c[0], c[1], c[2]));
  // render at reduced grid then upscale via ellipse blur — fast at 4K
  const step = 6;
  noStroke();
  const zc = 0.5 + 0.5*Math.cos(ang), zs = 0.5 + 0.5*Math.sin(ang);
  for (let y=0; y<height; y+=step){
    for (let x=0; x<width; x+=step){
      const n = noise(x*0.0005, y*0.0005, zc*1.2 + zs*0.6);
      const n2 = noise(x*0.0012+100, y*0.0012, zs*1.0);
      const idx = n * (cols.length-1);
      const i0 = Math.floor(idx), i1 = Math.min(i0+1, cols.length-1);
      const c = lerpColor(cols[i0], cols[i1], idx-i0);
      fill(hue(c), saturation(c), brightness(c)*(0.75+0.35*n2));
      rect(x, y, step+1, step+1);
    }
  }
}
</script>
</body>
</html>
