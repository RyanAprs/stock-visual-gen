<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>waves</title>
<script>p5.disableFriendlyErrors = true;</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
<style>html,body{margin:0;padding:0;overflow:hidden;background:#000}canvas{display:block}</style>
</head>
<body>
<script>
// === stockgen sketch: layered sine-wave landscape ===
// Flowing horizontal wave bands, seamless loop. Rhythmic, elegant.
const P = Object.assign({ seed:42, width:3840, height:2160, frames:300 }, window.STOCKGEN || {});

let PAL;
const PALETTES = [
  {bg:'#04070f', h:205, s:70}, {bg:'#0c0512', h:295, s:65},
  {bg:'#0a0803', h:42, s:75},  {bg:'#03100c', h:158, s:60},
  {bg:'#0f0503', h:8, s:72},
];
const LAYERS = 26;

function setup(){
  createCanvas(P.width,P.height);
  pixelDensity(1);
  colorMode(HSB,360,100,100,100);
  randomSeed(P.seed); noiseSeed(P.seed);
  PAL = PALETTES[P.seed % PALETTES.length];
  noLoop();
  window._p5Ready = true;
}

function draw(){
  const t = frameCount / P.frames;
  const ang = TWO_PI * t;
  background(PAL.bg);
  noStroke();
  for (let L=0; L<LAYERS; L++){
    const yBase = height * (0.15 + 0.9*(L/LAYERS));
    const bri = 30 + 65*(L/LAYERS);
    const amp = 120 + 260*(L/LAYERS);
    const hueShift = PAL.h + (L-LAYERS/2)*2.2;
    fill(hueShift % 360, PAL.s, bri, 92);
    beginShape();
    vertex(0, height);
    for (let x=0; x<=width; x+=14){
      // looped phase: cos/sin of ang keeps frame0 == frameN
      const ph = x*0.0016 + L*0.35;
      const y = yBase
        + Math.sin(ph + ang + Math.cos(ang)*0.6) * amp
        + Math.sin(ph*2.3 - ang*1.5) * amp*0.28;
      vertex(x, y);
    }
    vertex(width, height);
    endShape(CLOSE);
  }
}
</script>
</body>
</html>
