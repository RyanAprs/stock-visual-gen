<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>data</title>
<script>p5.disableFriendlyErrors = true;</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
<style>html,body{margin:0;padding:0;overflow:hidden;background:#000}canvas{display:block}</style>
</head>
<body>
<script>
// === stockgen sketch: abstract data-viz network ===
// Animated node-link graph with pulsing connections. Tech / corporate.
const P = Object.assign({ seed:42, width:3840, height:2160, frames:300 }, window.STOCKGEN || {});

let PAL, nodes=[], edges=[];
const PALETTES = [
  {bg:'#040910', h:200}, {bg:'#0b0513', h:290},
  {bg:'#0a0803', h:44},  {bg:'#03100d', h:160}, {bg:'#100504', h:10},
];
const N = 70;

function setup(){
  createCanvas(P.width,P.height);
  pixelDensity(1);
  colorMode(HSB,360,100,100,100);
  randomSeed(P.seed); noiseSeed(P.seed);
  PAL = PALETTES[P.seed % PALETTES.length];
  for (let i=0;i<N;i++){
    nodes.push({ x:random(width), y:random(height),
      r:random(6,26), phase:random(TWO_PI), amp:random(20,70) });
  }
  // connect nearest neighbors
  for (let i=0;i<N;i++){
    for (let j=i+1;j<N;j++){
      const d = dist(nodes[i].x,nodes[i].y,nodes[j].x,nodes[j].y);
      if (d < 520) edges.push([i,j,d]);
    }
  }
  noLoop();
  window._p5Ready = true;
}

function nodePos(o, ang){
  return { x:o.x + Math.cos(ang+o.phase)*o.amp, y:o.y + Math.sin(ang*1.2+o.phase)*o.amp };
}

function draw(){
  const t = frameCount / P.frames;
  const ang = TWO_PI * t;
  background(PAL.bg);
  // edges
  strokeWeight(2);
  for (const [i,j,d] of edges){
    const a = nodePos(nodes[i],ang), b = nodePos(nodes[j],ang);
    const pulse = 0.5 + 0.5*Math.sin(ang*2 - d*0.01);
    stroke(PAL.h, 60, 90, 8 + 22*pulse*(1 - d/520));
    line(a.x,a.y,b.x,b.y);
  }
  // nodes
  noStroke();
  for (const o of nodes){
    const p = nodePos(o,ang);
    const pulse = 0.7 + 0.3*Math.sin(ang*3 + o.phase);
    fill(PAL.h, 30, 100, 90);
    ellipse(p.x, p.y, o.r*2*pulse, o.r*2*pulse);
    fill(PAL.h, 55, 100, 25);
    ellipse(p.x, p.y, o.r*5*pulse, o.r*5*pulse);
  }
}
</script>
</body>
</html>
